name: Recordatorios de eventos (4 horas antes)

# Corre cada 30 minutos, gratis, usando GitHub Actions como "reloj"
# porque el plan gratuito de Vercel solo permite un cron al día.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de recordatorios
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/event-four-hour" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
